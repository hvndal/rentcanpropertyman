<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenant Dashboard | RentCan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background: var(--mist);">

  <nav class="dashboard-nav">
    <a href="index.html" class="logo">RentCan</a>
    <div>
      <span style="font-weight: 600; margin-right: 20px; font-size: 14px; color: var(--muted);" id="userEmail">Loading...</span>
      <button class="btn btn-line" id="logoutBtn" style="padding: 8px 16px; font-size: 13px;">Sign Out</button>
    </div>
  </nav>

  <main class="dashboard-main reveal">
    <h1>Welcome Home</h1>
    <p>Manage your lease, payments, and requests.</p>
    
    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Next Rent Due</div>
        <div class="value">₹25,000</div>
        <div style="font-size: 13px; color: var(--emerald); font-weight: 600; margin-top: 8px;">Due in 5 days</div>
      </div>
      <div class="stat-card">
        <div class="label">Active Lease</div>
        <div class="value" style="font-size: 24px;">Phase 7, Flat 301</div>
        <div style="font-size: 13px; color: var(--muted); margin-top: 8px;">Ends Oct 2027</div>
      </div>
    </div>
    
    <button class="btn btn-fill" style="padding: 16px 32px;">Pay Rent Now</button>
  </main>

  <script src="mock-supabase.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
