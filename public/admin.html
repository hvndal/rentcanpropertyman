﻿<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" name="viewport">
<meta name="robots" content="noindex, nofollow">
<title>RentCan | Admin Inspection Hub</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/seo/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/tailwind-brand.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/rentcan-config.js"></script>
<script src="/js/app.js"></script>
<style>
  body { background-color: #4E4238; color: #F2F5F4; font-family: 'Plus Jakarta Sans', sans-serif; }
  .glass-card { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(207, 223, 222, 0.18); }
  .rc-admin-accent { color: #D5B259; }
  .rc-admin-btn { background: #D5B259; color: #4E4238; }
  .rc-admin-btn:hover { background: #e0c06a; }
  .rc-admin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .rc-admin-focus:focus { border-color: #D5B259; outline: none; }
  .rc-admin-icon-wrap { background: rgba(213, 178, 89, 0.2); border: 1px solid rgba(213, 178, 89, 0.4); }
</style>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/css/brand.css">
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

<div id="admin-auth-gate" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4">
  <div class="glass-card p-8 rounded-2xl max-w-sm w-full space-y-6 text-center shadow-2xl">
    <div class="w-14 h-14 rc-admin-icon-wrap rounded-2xl flex items-center justify-center mx-auto rc-admin-accent">
      <span class="material-symbols-outlined text-3xl">admin_panel_settings</span>
    </div>
    <div>
      <h2 class="text-xl font-black tracking-tight text-white">RentCan Admin</h2>
      <p class="text-xs text-gray-400 mt-1">Sign in, then enter the server admin passcode</p>
    </div>
    <form onsubmit="verifyAdminPasscode(event)" class="space-y-4">
      <input type="password" id="admin-passcode" placeholder="Admin passcode" required autocomplete="current-password" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-400 outline-none rc-admin-focus text-center tracking-widest">
      <p id="admin-auth-error" class="text-xs text-red-400 hidden"></p>
      <button type="submit" id="admin-auth-btn" class="w-full rc-admin-btn font-extrabold text-sm py-3 rounded-xl transition-all shadow-lg">Access Portal</button>
    </form>
  </div>
</div>

<header class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 py-4 border-b border-white/10">
  <div class="flex items-center gap-3 min-w-0">
    <a href="/" class="rc-brand-logo rc-brand-logo--ghost rc-brand-logo--app shrink-0" aria-label="RentCan">
      <img src="/assets/logos/rentcan-wordmark-transparent.png" alt="RentCan">
    </a>
    <span class="text-[10px] font-bold uppercase tracking-widest rc-admin-accent">Admin</span>
    <span class="text-xs font-bold rc-admin-accent uppercase tracking-widest truncate hidden sm:inline">Inspection &amp; Vendor Hub</span>
  </div>
  <div class="flex items-center gap-3">
    <a href="/dashboard" class="text-xs font-bold text-gray-300 hover:text-white flex items-center gap-1"><span class="material-symbols-outlined text-sm">dashboard</span> User View</a>
    <button type="button" onclick="logoutAdmin()" class="text-xs font-bold text-red-400 hover:text-red-300 flex items-center gap-1"><span class="material-symbols-outlined text-sm">logout</span> Exit</button>
  </div>
</header>

<main class="flex-1 max-w-5xl mx-auto w-full py-8 space-y-8">
  <section class="glass-card p-6 rounded-2xl space-y-4">
    <div class="flex items-center gap-3 rc-admin-accent">
      <span class="material-symbols-outlined text-2xl">home_work</span>
      <h3 class="text-lg font-bold text-white tracking-tight">1. Property &amp; inspection date</h3>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Property</label>
        <select id="admin-prop-select" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white outline-none rc-admin-focus">
          <option value="">Select property"¦</option>
        </select>
      </div>
      <div>
        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Inspection date</label>
        <input type="date" id="admin-inspection-date" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white outline-none rc-admin-focus">
      </div>
    </div>
  </section>

  <section class="glass-card p-6 rounded-2xl space-y-4">
    <div class="flex items-center gap-3 rc-admin-accent">
      <span class="material-symbols-outlined text-2xl">checklist</span>
      <h3 class="text-lg font-bold text-white tracking-tight">2. Outcome &amp; notes</h3>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Outcome</label>
        <select id="admin-outcome" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white outline-none rc-admin-focus">
          <option value="pass">Pass</option>
          <option value="minor_issue">Minor issue</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
      <div>
        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Summary title</label>
        <input type="text" id="admin-summary" placeholder="e.g. July monthly inspection" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none rc-admin-focus">
      </div>
    </div>
    <div>
      <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Notes for landlord / tenant</label>
      <textarea id="admin-notes" rows="3" placeholder="Condition notes, photo highlights, follow-ups"¦" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none rc-admin-focus resize-none"></textarea>
    </div>
    <div>
      <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Photo URLs (optional, one per line)</label>
      <textarea id="admin-photos" rows="2" placeholder="https://"¦" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none rc-admin-focus resize-none"></textarea>
    </div>
    <button type="button" id="publish-btn" onclick="publishInspectionReport()" class="bg-white/10 border border-white/20 text-white font-bold text-sm px-6 py-3 rounded-xl hover:bg-white/20 transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-lg">publish</span> Publish Inspection Report
    </button>
    <p id="publish-status" class="text-xs text-gray-400"></p>
  </section>

  <section class="glass-card p-6 rounded-2xl space-y-4">
    <div class="flex items-center gap-3 rc-admin-accent">
      <span class="material-symbols-outlined text-2xl">engineering</span>
      <h3 class="text-lg font-bold text-white tracking-tight">3. Vendor dispatch (WhatsApp)</h3>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Issue category</label>
        <select id="admin-issue-type" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white outline-none rc-admin-focus">
          <option value="Plumbing">Plumbing</option>
          <option value="Electrical">Electrical</option>
          <option value="AC Repair">AC Repair</option>
          <option value="Painting">Painting</option>
          <option value="General Maintenance">General Maintenance</option>
        </select>
      </div>
      <div>
        <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Tenant name</label>
        <input type="text" id="admin-tenant-name" placeholder="Tenant name" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none rc-admin-focus">
      </div>
    </div>
    <div>
      <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Issue details</label>
      <textarea id="admin-issue-details" rows="3" placeholder="Describe the issue for the vendor"¦" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none rc-admin-focus resize-none"></textarea>
    </div>
    <button type="button" onclick="dispatchVendorWhatsApp()" class="rc-admin-btn font-extrabold text-sm px-6 py-3 rounded-xl transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-lg">send</span> Dispatch Vendor via WhatsApp
    </button>
  </section>
</main>

<script>
async function verifyAdminPasscode(event) {
  event.preventDefault();
  const pass = document.getElementById('admin-passcode').value;
  const errEl = document.getElementById('admin-auth-error');
  const btn = document.getElementById('admin-auth-btn');
  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Checking"¦';
  try {
    const client = await getSupabaseClient();
    const { data: { session } } = client ? await client.auth.getSession() : { data: { session: null } };
    if (!session) {
      errEl.textContent = 'Sign in to RentCan first, then return to /admin.';
      errEl.classList.remove('hidden');
      return;
    }
    const res = await fetch('/api/admin/verify', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + session.access_token
      },
      body: JSON.stringify({ passcode: pass })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.type === 'error') {
      errEl.textContent = data.message || 'Invalid admin passcode.';
      errEl.classList.remove('hidden');
      return;
    }
    sessionStorage.setItem('rentcan_admin_auth', 'true');
    sessionStorage.setItem('rentcan_admin_token', data.token || '1');
    document.getElementById('admin-auth-gate').classList.add('hidden');
    await loadAdminProperties();
  } catch (e) {
    errEl.textContent = 'Could not verify admin access. Try again.';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Access Portal';
  }
}

function logoutAdmin() {
  sessionStorage.removeItem('rentcan_admin_auth');
  sessionStorage.removeItem('rentcan_admin_token');
  window.location.href = '/dashboard';
}

function dispatchVendorWhatsApp() {
  const propSelect = document.getElementById('admin-prop-select');
  const property = propSelect.options[propSelect.selectedIndex]?.text || 'Unknown Property';
  const issue = document.getElementById('admin-issue-type').value;
  const tenant = document.getElementById('admin-tenant-name').value || 'N/A';
  const details = document.getElementById('admin-issue-details').value || 'No details provided';
  const msg = '*VENDOR DISPATCH REQUEST*%0A%0A*Property:* ' + encodeURIComponent(property) + '%0A*Issue:* ' + encodeURIComponent(issue) + '%0A*Tenant:* ' + encodeURIComponent(tenant) + '%0A*Details:* ' + encodeURIComponent(details);
  window.open('https://wa.me/918146298024?text=' + msg, '_blank');
}

async function loadAdminProperties() {
  const client = await getSupabaseClient();
  if (!client) return;
  const { data: { session } } = await client.auth.getSession();
  if (!session) return;

  // Prefer service-backed list: owner properties for this signed-in admin/landlord account
  const { data: properties } = await client.from('properties').select('id, name, address').order('created_at', { ascending: false });
  const select = document.getElementById('admin-prop-select');
  select.innerHTML = '<option value="">Select property"¦</option>';
  (properties || []).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name + (p.address ? ' — ' + p.address : '');
    select.appendChild(opt);
  });
  if (!(properties || []).length) {
    document.getElementById('publish-status').textContent =
      'No properties visible for this account. Sign in as the property owner (or run inspections.sql + seed data).';
  }
}

async function publishInspectionReport() {
  const propId = document.getElementById('admin-prop-select').value;
  const date = document.getElementById('admin-inspection-date').value;
  const outcome = document.getElementById('admin-outcome').value;
  const summary = document.getElementById('admin-summary').value.trim() || ('Inspection — ' + date);
  const notes = document.getElementById('admin-notes').value.trim();
  const photos = document.getElementById('admin-photos').value.split('\n').map(s => s.trim()).filter(Boolean);
  const statusEl = document.getElementById('publish-status');
  const btn = document.getElementById('publish-btn');

  if (!propId || !date) {
    alert('Please select property and date.');
    return;
  }
  if (sessionStorage.getItem('rentcan_admin_auth') !== 'true') {
    alert('Admin session expired. Unlock the portal again.');
    document.getElementById('admin-auth-gate').classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  statusEl.textContent = 'Publishing"¦';
  try {
    const client = await getSupabaseClient();
    const { data: { session } } = await client.auth.getSession();
    if (!session) throw new Error('Not signed in');

    const payload = {
      property_id: propId,
      inspection_date: date,
      status: 'published',
      outcome,
      summary,
      notes,
      checklist: (window.RC_INSPECTION_CHECKLIST || []).map(label => ({ label, ok: true })),
      photo_urls: photos,
      inspected_by: session.user.id,
      published_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };

    const { data, error } = await client.from('inspections').insert(payload).select('id').single();
    if (error) {
      // Fallback: store as maintenance inspection row if inspections table missing
      const { error: mErr } = await client.from('maintenance_requests').insert({
        property_id: propId,
        title: summary,
        description: notes || summary,
        category: 'inspection',
        status: outcome === 'urgent' ? 'pending' : 'resolved',
        priority: outcome === 'urgent' ? 'high' : 'low',
        scheduled_date: date
      });
      if (mErr) throw error;
      statusEl.textContent = 'Saved as inspection activity (run database/inspections.sql for full reports table).';
    } else {
      statusEl.textContent = 'Published. Report id: ' + data.id;
    }
    setTimeout(() => { window.location.href = '/inspections'; }, 900);
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Publish failed: ' + (e.message || 'unknown error') + '. Ensure you own the property and inspections.sql is applied.';
  } finally {
    btn.disabled = false;
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const nextDateStr = window.getNextInspectionDate ? window.getNextInspectionDate() : '';
  if (nextDateStr) document.getElementById('admin-inspection-date').value = nextDateStr;

  if (sessionStorage.getItem('rentcan_admin_auth') === 'true') {
    document.getElementById('admin-auth-gate').classList.add('hidden');
    await loadAdminProperties();
  }
});
</script>
</body>
</html>
