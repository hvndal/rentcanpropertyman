<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

<!-- Auth Gate Modal -->
<div id="admin-auth-gate" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4">
  <div class="glass-card p-8 rounded-2xl max-w-sm w-full space-y-6 text-center shadow-2xl">
    <div class="w-14 h-14 bg-emerald-500/20 border border-emerald-500/40 rounded-2xl flex items-center justify-center mx-auto text-emerald-400">
      <span class="material-symbols-outlined text-3xl">admin_panel_settings</span>
    </div>
    <div>
      <h2 class="text-xl font-black tracking-tight text-white">RentCan Hidden Admin</h2>
      <p class="text-xs text-gray-400 mt-1">Enter admin security passcode</p>
    </div>
    <form onsubmit="verifyAdminPasscode(event)" class="space-y-4">
      <input type="password" id="admin-passcode" placeholder="Enter admin key..." required class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-400 outline-none focus9border-emerald-400 text-center tracking-widest">
      <button type="submit" class="w-full bg-emerald-500 text-black font-extrabold text-sm py-3 rounded-xl hover:bg-emerald-400 transition-all shadow-lg">Access Portal</button>
    </form>
  </div>
</div>

    <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Monthly Inspection & Vendor Dispatch Hub</span>
  </div>
  <div class="flex items-center gap-3">
    <a href="dashboard.html" class="text-xs font-bold text-gray-300 hover:text-white flex items-center gap-1"><span class="material-symbols-outlined text-sm">dashboard</span> User View</a>
    <button onclick="logoutAdmin()" class="text-xs font-bold text-red-400 hover:text-red-300 flex items-center gap-1"><span class="material-symbols-outlined text-sm">logout</span> Exit Admin</button>
  </div>
</header>

document.addEventListener('DOMContentLoaded', async () => {
  if (sessionStorage.getItem('rentcan_admin_auth') === 'true') {
    document.getElementById('admin-auth-gate').classList.add('hidden');
  }

  const nextDateStr = window.getNextInspectionDate ? window.getNextInspectionDate() : '2026-08-05';
  if (nextDateStr) document.getElementById('admin-inspection-date').value = nextDateStr;
});

function publishInspectionReport() {
  const propId = document.getElementById('admin-prop-select').value;
  const date = document.getElementById('admin-inspection-date').value;
  if (!propId || !date) { alert('Please select property and date.'); return; }
  alert('Inspection photos and report published for Landlord & Tenant!');
  window.location.href = 'inspections.html';
}
