<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | RentCan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

<script type="text/javascript">
  var configuration = {
    widgetId: "366674716248383037373030",
    tokenAuth: "{YOUR_MSG91_AUTHKEY_HERE}",
    exposeMethods: true,
    success: (data) => {
        console.log('MSG91 success response', data);
    },
    failure: (error) => {
        console.log('MSG91 failure reason', error);
    }
  };
</script>
<script type="text/javascript" onload="initSendOTP(configuration)" src="https://verify.msg91.com/otp-provider.js"></script>

</head>
<body>
  <div class="auth-page" style="animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
    <div class="auth-card">
      <a href="index.html" class="logo" style="color: var(--ink); font-size: 24px; display: block; margin-bottom: 24px;">RentCan</a>
      <h1>Welcome back</h1>
      <p>Enter your details to sign in to your account.</p>
      
      <form class="auth-form" id="loginForm">

        <div class="role-selector">
          <button type="button" class="role-btn active" data-role="tenant">I'm a Tenant</button>
          <button type="button" class="role-btn" data-role="landlord">I'm a Landlord</button>
        </div>

        <input type="text" id="email" class="auth-input" placeholder="Email or Mobile Number (e.g. 919999999999)" required>
        <button type="submit" class="btn btn-fill" style="width: 100%; border-radius: 12px; font-size: 16px;">Send OTP</button>
      </form>

      <form class="auth-form" id="otpForm" style="display: none;">
        <p style="color: var(--muted); margin-bottom: 20px; font-size: 14px;">We've sent a 6-digit code to your email/phone. Enter it below to verify.</p>
        <input type="text" id="otpCode" class="auth-input" placeholder="Enter 6-digit OTP" required maxlength="6" style="text-align: center; letter-spacing: 0.5em; font-size: 20px; font-weight: 600;">
        <button type="submit" class="btn btn-fill" style="width: 100%; border-radius: 12px; font-size: 16px;">Verify OTP</button>
        <button type="button" id="resendOtpBtn" style="background: none; border: none; color: var(--emerald); font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px; transition: opacity 0.2s;">Didn't receive code? Resend.</button>
      </form>

      
      <p style="margin-top: 24px; margin-bottom: 0;">Don't have an account? <a href="signup.html" style="color: var(--emerald); font-weight: 600;">Sign up</a></p>
    </div>
  </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
